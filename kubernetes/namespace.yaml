# The namespace everything below lives in (kustomization.yaml sets it on each resource), created
# here so `kubectl apply -k kubernetes/` works on a fresh cluster. Renaming it means changing both.
apiVersion: v1
kind: Namespace
metadata:
  name: fitness
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
